<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gobbl — UI Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #efece5; }
  body { font-family: 'DM Sans', system-ui, sans-serif; color: #1a1a17; }
  * { box-sizing: border-box; }
  /* Hide default scrollbar inside artboards */
  .ab-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .ab-scroll { scrollbar-width: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="turkeys-flat.jsx"></script>
<script type="text/babel" src="harvest.jsx"></script>
<script type="text/babel" src="harvest-extras.jsx"></script>
<script type="text/babel" src="harvest-shop.jsx"></script>
<script type="text/babel" src="harvest-motion.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;

  function App() {
    return (
      <DesignCanvas>
        <DCSection
          id="harvest"
          title="Gobbl — Harvest direction"
          subtitle="Elevated warm. Confident orange, generous whitespace, grown-up gamification. Flat illustrated turkeys, Bricolage Grotesque display + DM Sans body + JetBrains Mono numerals."
        >
          <DCArtboard id="h-dash-m"  label="Dashboard · mobile" width={390} height={844}>
            <window.HarvestDashboardMobile />
          </DCArtboard>
          <DCArtboard id="h-prof-m"  label="Profile · mobile"   width={390} height={844}>
            <window.HarvestProfileMobile />
          </DCArtboard>
          <DCArtboard id="h-skil-m"  label="Skills · mobile"    width={390} height={844}>
            <window.HarvestSkillsMobile />
          </DCArtboard>
          <DCArtboard id="h-setup-m"  label="Topic setup · mobile" width={390} height={844}>
            <window.HarvestTopicSetup />
          </DCArtboard>
          <DCArtboard id="h-arena-m"  label="Debate arena · mobile" width={390} height={844}>
            <window.HarvestDebateArena />
          </DCArtboard>
          <DCArtboard id="h-levelup-m"  label="Level-up · mobile" width={390} height={844}>
            <window.HarvestLevelUp />
          </DCArtboard>
          <DCArtboard id="h-shop-m"  label="Shop · mobile" width={390} height={844}>
            <window.HarvestShop />
          </DCArtboard>
          <DCArtboard id="h-dash-dark-m"  label="Dashboard · dark · mobile" width={390} height={844}>
            <window.HarvestDashboardDark />
          </DCArtboard>
          <DCArtboard id="h-dash-d"  label="Dashboard · desktop" width={1280} height={820}>
            <window.HarvestDashboardDesktop />
          </DCArtboard>
          <DCArtboard id="h-motion"  label="Motion & interaction notes" width={1280} height={820}>
            <window.HarvestMotionNotes />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
